name: GhostForge APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-Locate and Self-Heal Files
        run: |
          echo "=== Starting Self-Locate and Self-Heal ==="
          
          # Step 1: Locate Python files
          echo "--- Locating Python files ---"
          PYTHON_FILES=$(find . -maxdepth 1 -name "*.py" -type f | grep -v __pycache__ | sort)
          
          if [ -z "$PYTHON_FILES" ]; then
            echo "ERROR: No Python files found in repository root"
            echo "Creating default main.py"
            cat > main.py << 'EOF'
          # GhostForge Main Application
          from kivy.app import App
          
          class GhostForgeApp(App):
              def build(self):
                  return None
          
          if __name__ == '__main__':
              GhostForgeApp().run()
          EOF
            echo "✓ Created default main.py"
            MAIN_FILE="main.py"
          else
            echo "Found Python files:"
            echo "$PYTHON_FILES"
            
            # Priority: ghostforge_main.py > main.py > any other .py file
            if echo "$PYTHON_FILES" | grep -q "ghostforge_main.py"; then
              MAIN_FILE="ghostforge_main.py"
              echo "✓ Located: ghostforge_main.py (primary)"
            elif echo "$PYTHON_FILES" | grep -q "main.py"; then
              MAIN_FILE="main.py"
              echo "✓ Located: main.py (existing)"
            else
              MAIN_FILE=$(echo "$PYTHON_FILES" | head -n 1 | sed 's|./||')
              echo "✓ Located: $MAIN_FILE (fallback)"
            fi
          fi
          
          # Step 2: Locate or create buildozer.spec
          echo -e "\n--- Locating buildozer spec file ---"
          SPEC_FILES=$(find . -maxdepth 1 -name "*.spec" -type f | sort)
          
          if [ -z "$SPEC_FILES" ]; then
            echo "ERROR: No .spec files found"
            
            if [ -f "buildozer_app.spec" ]; then
              SPEC_FILE="buildozer_app.spec"
              echo "✓ Located: buildozer_app.spec"
            else
              echo "Creating default buildozer.spec"
              cat > buildozer.spec << 'EOF'
          [app]
          title = GhostForge
          package.name = ghostforge
          package.domain = com.ghostforge
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
              echo "✓ Created default buildozer.spec"
              SPEC_FILE="buildozer.spec"
            fi
          else
            echo "Found spec files:"
            echo "$SPEC_FILES"
            
            # Priority: buildozer.spec > buildozer_app.spec > any other .spec
            if echo "$SPEC_FILES" | grep -q "buildozer.spec"; then
              SPEC_FILE="buildozer.spec"
              echo "✓ Located: buildozer.spec (primary)"
            elif echo "$SPEC_FILES" | grep -q "buildozer_app.spec"; then
              SPEC_FILE="buildozer_app.spec"
              echo "✓ Located: buildozer_app.spec (will rename)"
            else
              SPEC_FILE=$(echo "$SPEC_FILES" | head -n 1 | sed 's|./||')
              echo "✓ Located: $SPEC_FILE (will use)"
            fi
          fi
          
          # Step 3: Prepare files
          echo -e "\n--- Preparing files ---"
          if [ "$MAIN_FILE" != "main.py" ]; then
            echo "Renaming $MAIN_FILE -> main.py"
            cp "$MAIN_FILE" main.py
            echo "✓ main.py ready"
          else
            echo "✓ main.py already in place"
          fi
          
          if [ "$SPEC_FILE" != "buildozer.spec" ]; then
            echo "Renaming $SPEC_FILE -> buildozer.spec"
            cp "$SPEC_FILE" buildozer.spec
            echo "✓ buildozer.spec ready"
          else
            echo "✓ buildozer.spec already in place"
          fi
          
          # Step 4: Verify and display
          echo -e "\n--- Verification ---"
          ls -lah *.py *.spec
          
          echo -e "\n✓ Self-Locate and Self-Heal Complete"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo5 libncursesw5-dev \
            cmake libffi-dev libssl-dev
          pip install Cython==0.29.33 buildozer

      - name: Patch buildozer.spec
        run: |
          echo "android.sdk_path = $HOME/.buildozer/android/platform/android-sdk" >> buildozer.spec
          sed -i 's/package.name = .*/package.name = ghostforge/' buildozer.spec
          sed -i 's/package.domain = .*/package.domain = com.ghostforge/' buildozer.spec

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/33.0.2
          buildozer android debug
        env:
          BUILDOZER_ALLOW_UNSTABLE: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostForge-APK
          path: bin/*.apk
