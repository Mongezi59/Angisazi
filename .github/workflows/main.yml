name: GhostForge APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename files for Buildozer
        run: |
          mv ghostforge_main.py main.py
          mv buildozer_app.spec buildozer.spec
          ls -la *.py *.spec

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo5 libncursesw5-dev \
            cmake libffi-dev libssl-dev
          pip install Cython==0.29.33 buildozer

      - name: Patch buildozer.spec
        run: |
          echo "android.sdk_path = $HOME/.buildozer/android/platform/android-sdk" >> buildozer.spec
          sed -i 's/package.name = .*/package.name = ghostforge/' buildozer.spec
          sed -i 's/package.domain = .*/package.domain = com.ghostforge/' buildozer.spec

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/33.0.2
          buildozer android debug
        env:
          BUILDOZER_ALLOW_UNSTABLE: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostForge-APK
          path: bin/*.apk
