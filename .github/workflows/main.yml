name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openjdk-11-jdk-headless \
          ant \
          git \
          build-essential \
          libncurses5 \
          libssl-dev \
          zlib1g-dev
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Create buildozer cache directory
      run: mkdir -p ~/.buildozer
    
    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Download Android SDK/NDK
      run: |
        mkdir -p ~/.android
        mkdir -p ~/android-sdk
        
        # Set environment variables
        export ANDROID_SDK_ROOT=~/android-sdk
        export ANDROID_NDK_ROOT=~/android-sdk/ndk/21.3.6528147
        
        # Create necessary directories
        mkdir -p ${ANDROID_SDK_ROOT}/platforms
        mkdir -p ${ANDROID_SDK_ROOT}/build-tools
        mkdir -p ${ANDROID_SDK_ROOT}/ndk
    
    - name: Build with Buildozer
      run: |
        cd $GITHUB_WORKSPACE
        
        # Create .buildozer if not exists
        mkdir -p .buildozer
        
        # Run buildozer
        buildozer android release
      timeout-minutes: 120
    
    - name: List build artifacts
      if: always()
      run: |
        find . -name "*.apk" -o -name "*.aab" | head -20
    
    - name: Upload APK to artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: apk-build
        path: bin/*.apk
        retention-days: 30
    
    - name: Create Release
      if: success() && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
    
    - name: Upload to Release
      if: success() && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
